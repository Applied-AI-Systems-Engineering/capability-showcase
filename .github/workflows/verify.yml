name: Verify public capabilities

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  langgraph:
    name: LangGraph deterministic tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install constrained public dependencies
        working-directory: langgraph
        run: python -m pip install --index-url https://pypi.org/simple -r requirements.txt
      - name: Verify deterministic graph behavior
        working-directory: langgraph
        env:
          LANGSMITH_TRACING: 'false'
          LANGCHAIN_TRACING_V2: 'false'
        run: python -m unittest discover -s . -p 'test_*.py' -v
