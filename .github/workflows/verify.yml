name: Verify public capabilities

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  langgraph:
    name: LangGraph deterministic tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install constrained public dependencies
        working-directory: langgraph
        run: python -m pip install --index-url https://pypi.org/simple -r requirements.txt
      - name: Verify deterministic graph behavior
        working-directory: langgraph
        env:
          LANGSMITH_TRACING: 'false'
          LANGCHAIN_TRACING_V2: 'false'
        run: python -m unittest discover -s . -p 'test_*.py' -v

  n8n:
    name: n8n synthetic execution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute isolated synthetic workflows
        run: python3 .github/scripts/verify_n8n.py

  distribution:
    name: Verified public distribution
    needs: [langgraph, n8n]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package selected capabilities
        run: python3 .github/scripts/package_capabilities.py
      - name: Retain checked distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capability-showcase-${{ github.sha }}
          path: ${{ runner.temp }}/capability-distribution
          if-no-files-found: error
          retention-days: 7
